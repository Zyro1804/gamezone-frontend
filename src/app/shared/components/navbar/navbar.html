
<header class="gz-navbar">

  <a class="gz-logo" routerLink="/gamezone">
    <span>GameZone</span>
  </a>

  <nav class="gz-links">
    <a
      routerLink="/gamezone"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }">
      <i class="pi pi-home" aria-hidden="true"></i>
      Inicio
    </a>

    <a routerLink="/gamezone" fragment="categorias">
      <i class="pi pi-th-large" aria-hidden="true"></i>
      Categorías
    </a>
  </nav>

  <button class="gz-login" type="button" (click)="abrirLogin()">
  <i class="pi pi-user"></i>
  Ingresar
  </button>

</header>

<app-login-modal
  [visible]="mostrarLogin()"
  (visibleChange)="mostrarLogin.set($event)"
/>
