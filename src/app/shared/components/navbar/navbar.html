
<header class="gz-navbar">

  <a class="gz-logo" routerLink="/gamezone">
    <span>GameZone</span>
  </a>

  <nav class="gz-links">
    <a
      routerLink="/gamezone"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }">
      <i class="pi pi-home" aria-hidden="true"></i>
      Inicio
    </a>

    <a routerLink="/gamezone" fragment="categorias">
      <i class="pi pi-th-large" aria-hidden="true"></i>
      Categorías
    </a>
  </nav>

  <a class="gz-login" routerLink="/login">
    <i class="pi pi-user" aria-hidden="true"></i>
    Ingresar
  </a>

</header>
